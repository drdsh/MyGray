# CI pipeline = automated part of IEC 62304 §5.5–5.7 verification.
# Every job's output is archived as release evidence.
name: ci
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    container: ghcr.io/example/mygray-build:pinned   # packaging/Containerfile.build, digest-pinned
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --profile ci        # JUnit → target/nextest/ci/junit.xml
      - run: cargo test --workspace --doc
      - run: cargo deny check
      - run: cargo xtask trace                                 # requirement ⇄ test gate
      - run: cargo xtask arch-check                            # dependency rules
      - run: cargo xtask soup-check
      - run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
  fuzz-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo +nightly fuzz run parse_bytes --fuzz-dir crates/mygray-rdsr/fuzz -- -max_total_time=3600
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo bench -p mygray-rdsr   # SRS-RDSR-005 regression check
